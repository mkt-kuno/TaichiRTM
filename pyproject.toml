[project]
name = "taichi-rtm"
version = "2.0.0"
description = "GPU-accelerated Reverse Time Migration for seismic exploration using Taichi"
readme = "README.md"
license = {text = "LGPL-2.1-or-later"}
authors = [
    {name = "Yutaro Hara"}
]
requires-python = ">=3.9,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["seismic", "reverse-time-migration", "RTM", "geophysics", "taichi", "gpu"]

dependencies = [
    "numpy>=1.20.0",
    "taichi>=1.6.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "matplotlib>=3.5.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/mkt-kuno/TaichiRTM"
Repository = "https://github.com/mkt-kuno/TaichiRTM"
Issues = "https://github.com/mkt-kuno/TaichiRTM/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
